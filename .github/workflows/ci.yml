name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    strategy:
      matrix:
        go: ["1.22.2", "stable"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run Vet
        run: go vet ./...

      - name: Build Binary
        run: go build -v ./cmd/ledger-parity

      - name: Tests
        run: go test -race ./...
      - name: Offline demo
        shell: bash
        run: |
          set +e
          ./ledger-parity --demo --format json --out report.json
          status=$?
          set -e
          test "$status" -eq 3
          python3 -c 'import json; r=json.load(open("report.json")); assert (r["total_matched"],r["total_discrepancies"],r["total_unknown"]) == (1,4,3)'
      - name: SDP evidence and offline replay
        shell: bash
        run: |
          set +e
          ./ledger-parity --config examples/sdp/config.json --bundle evidence.json --out sdp-report.json
          captured=$?
          ./ledger-parity --replay evidence.json --out replayed-report.json
          replayed=$?
          set -e
          test "$captured" -eq 3
          test "$replayed" -eq 3
          cmp sdp-report.json replayed-report.json
          python3 -c 'import json; r=json.load(open("sdp-report.json")); assert (r["total_matched"],r["total_discrepancies"],r["total_unknown"]) == (1,1,1); assert not r["coverage"]["internal_complete"]'
