<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LedgerParity — Reconciliation Dashboard</title>
<style>
:root {
  --ink: #0B0E1E;
  --ink-2: #141A36;
  --line: #262D52;
  --teal: #3FE0C4;
  --violet: #7A5CFF;
  --amber: #FFB84A;
  --text: #F3F1E7;
  --slate: #9AA3C0;
  --red: #FF6B6B;
  --green: #4ADE80;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--ink); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; }
.container { max-width:1200px; margin:0 auto; padding:24px; }
header { text-align:center; padding:40px 0 24px; }
header h1 { font-size:28px; font-weight:600; letter-spacing:-0.5px; }
header h1 span { color:var(--teal); }
header p { color:var(--slate); margin-top:8px; font-size:14px; }

.drop-zone { border:2px dashed var(--line); border-radius:12px; padding:48px; text-align:center; margin:24px 0; cursor:pointer; transition:border-color .2s; }
.drop-zone:hover, .drop-zone.active { border-color:var(--teal); }
.drop-zone p { color:var(--slate); font-size:14px; }
.drop-zone .icon { font-size:48px; margin-bottom:12px; }

.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin:24px 0; }
.stat-card { background:var(--ink-2); border:1px solid var(--line); border-radius:10px; padding:20px; text-align:center; }
.stat-card .value { font-size:32px; font-weight:700; }
.stat-card .label { color:var(--slate); font-size:13px; margin-top:4px; }
.stat-card.match .value { color:var(--green); }
.stat-card.discrepancy .value { color:var(--red); }
.stat-card.unknown .value { color:var(--amber); }
.stat-card.total .value { color:var(--teal); }

.chart-section { background:var(--ink-2); border:1px solid var(--line); border-radius:10px; padding:24px; margin:24px 0; }
.chart-section h2 { font-size:16px; margin-bottom:16px; color:var(--slate); font-weight:500; }
.bar-chart { display:flex; gap:8px; align-items:flex-end; height:160px; }
.bar { flex:1; border-radius:6px 6px 0 0; position:relative; min-width:40px; transition:height .3s; }
.bar .count { position:absolute; top:-24px; left:50%; transform:translateX(-50%); font-size:13px; font-weight:600; }
.bar .bar-label { position:absolute; bottom:-24px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--slate); white-space:nowrap; }

.table-section { background:var(--ink-2); border:1px solid var(--line); border-radius:10px; padding:24px; margin:24px 0; overflow-x:auto; }
.table-section h2 { font-size:16px; margin-bottom:16px; color:var(--slate); font-weight:500; }
.table-section input { background:var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px 12px; color:var(--text); font-size:13px; width:300px; margin-bottom:16px; }
.table-section input:focus { outline:none; border-color:var(--teal); }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:10px 12px; border-bottom:2px solid var(--line); color:var(--slate); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:0.5px; }
td { padding:10px 12px; border-bottom:1px solid var(--line); }
tr:hover td { background:rgba(63,224,196,0.04); }
.badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
.badge.match { background:rgba(74,222,128,0.15); color:var(--green); }
.badge.discrepancy { background:rgba(255,107,107,0.15); color:var(--red); }
.badge.unknown { background:rgba(255,184,74,0.15); color:var(--amber); }
.amount-delta { color:var(--red); font-weight:500; }
.meta { color:var(--slate); font-size:12px; margin-top:8px; }
.hidden { display:none; }
footer { text-align:center; padding:40px 0; color:var(--slate); font-size:12px; }
footer a { color:var(--teal); text-decoration:none; }
.drop-zone:focus-visible { outline:2px solid var(--teal); outline-offset:4px; }
.bar-chart { margin-bottom:30px; overflow:visible; }
.table-section input { max-width:100%; }
td { overflow-wrap:anywhere; min-width:100px; }
#coverage p { margin-top:8px; overflow-wrap:anywhere; }
#load-status { color:var(--amber); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Ledger<span>Parity</span> Dashboard</h1>
    <p>Reconciliation report viewer — load a JSON report to visualize results</p>
  </header>

  <div id="drop-zone" class="drop-zone" role="button" tabindex="0" aria-label="Choose a reconciliation report">
    <div class="icon">&#128206;</div>
    <p>Drag &amp; drop a report JSON file here, or <strong>click to browse</strong></p>
    <input type="file" id="file-input" accept=".json" style="display:none">
  </div>

  <p id="load-status" role="status" aria-live="polite"></p>
  <div id="dashboard" class="hidden">
    <div class="chart-section" id="coverage"></div>
    <div class="stats" id="stats"></div>
    <div class="chart-section">
      <h2>Result Breakdown</h2>
      <div class="bar-chart" id="chart"></div>
    </div>
    <div class="table-section">
      <h2>Detailed Results</h2>
      <label for="search">Search results</label><br>
      <input type="text" id="search" placeholder="Search by ID, sender, recipient, asset...">
      <table>
        <thead>
          <tr><th>Status</th><th>Type</th><th>Internal ID</th><th>Operation IDs</th><th>Amount</th><th>Asset</th><th>Sender</th><th>Recipient</th><th>Delta</th><th>Notes</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="meta" id="result-count" aria-live="polite"></div>
    <div class="meta" id="meta"></div>
  </div>

  <footer>
    LedgerParity &middot; MIT licensed &middot; <a href="https://ledgerparity.vercel.app/">docs</a>
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const dropZone = $('#drop-zone');
const fileInput = $('#file-input');
const dashboard = $('#dashboard');
const MAX_BYTES = 32 * 1024 * 1024;
let currentResults = [];
let loadSequence = 0;
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
const display = value => escapeHTML(value || '—');

dropZone.addEventListener('click', e => { if (e.target !== fileInput) fileInput.click(); });
dropZone.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
});
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('active'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('active'); handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => { handleFile(e.target.files[0]); fileInput.value = ''; });
$('#search').addEventListener('input', e => renderTable(currentResults, e.target.value));

function validateReport(r) {
  const object = x => x !== null && typeof x === 'object' && !Array.isArray(x);
  if (!object(r) || !Array.isArray(r.results) || !object(r.coverage) || !object(r.discrepancy_counts)) {
    throw new Error('Choose a CLI report JSON, not a proof or evidence bundle.');
  }
  for (const key of ['total_internal', 'total_on_chain', 'total_matched', 'total_discrepancies', 'total_unknown']) {
    if (!Number.isSafeInteger(r[key]) || r[key] < 0) throw new Error('Invalid report total: ' + key);
  }
  for (const key of ['generated_at', 'time_window_start', 'time_window_end']) {
    if (typeof r[key] !== 'string' || !Number.isFinite(Date.parse(r[key]))) throw new Error('Invalid report date: ' + key);
  }
  const c = r.coverage;
  if (typeof c.network !== 'string' || typeof c.complete !== 'boolean' || typeof c.internal_complete !== 'boolean' ||
      typeof c.source !== 'string' || typeof c.reason !== 'string' || !Array.isArray(c.accounts) || c.accounts.some(a => typeof a !== 'string')) {
    throw new Error('Invalid coverage metadata.');
  }
  const totals = {EXACT:0, TOLERANT_MATCH:0, DISCREPANCY:0, UNKNOWN:0};
  const counts = new Map();
  for (const row of r.results) {
    if (!object(row) || typeof row.status !== 'string' || !Object.hasOwn(totals, row.status) || typeof row.discrepancy !== 'string') throw new Error('Invalid result status or type.');
    totals[row.status]++;
    if (row.status === 'DISCREPANCY') counts.set(row.discrepancy, (counts.get(row.discrepancy) || 0) + 1);
    for (const key of ['notes', 'amount_delta']) {
      if (row[key] != null && typeof row[key] !== 'string') throw new Error('Invalid result ' + key);
    }
    for (const key of ['internal_payment', 'on_chain_payment']) {
      if (row[key] == null) continue;
      if (!object(row[key])) throw new Error('Invalid payment record.');
      for (const field of ['id', 'sender', 'recipient', 'asset', 'amount', 'account', 'destination', 'asset_code', 'asset_issuer', 'operation_id', 'reference_id', 'business_reference', 'transaction_hash']) {
        if (row[key][field] != null && typeof row[key][field] !== 'string') throw new Error('Payment ' + field + ' must be text.');
      }
    }
    if (row.candidate_operation_ids != null && (!Array.isArray(row.candidate_operation_ids) || row.candidate_operation_ids.some(id => typeof id !== 'string'))) {
      throw new Error('Invalid candidate operation IDs.');
    }
  }
  if (totals.EXACT + totals.TOLERANT_MATCH !== r.total_matched || totals.DISCREPANCY !== r.total_discrepancies || totals.UNKNOWN !== r.total_unknown) {
    throw new Error('Report totals do not agree with result rows.');
  }
  for (const [type, count] of Object.entries(r.discrepancy_counts)) {
    if (!Number.isSafeInteger(count) || count < 0 || count !== (counts.get(type) || 0)) throw new Error('Discrepancy counts do not agree with result rows.');
  }
  for (const [type, count] of counts) {
    if (r.discrepancy_counts[type] !== count) throw new Error('Missing discrepancy count.');
  }
  return r;
}

function handleFile(file) {
  if (!file) return;
  const sequence = ++loadSequence;
  currentResults = [];
  dashboard.classList.add('hidden');
  $('#search').value = '';
  $('#load-status').textContent = 'Loading report…';
  if (file.size > MAX_BYTES) {
    $('#load-status').textContent = 'Report exceeds the 32 MiB limit.';
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    if (sequence !== loadSequence) return;
    try {
      render(validateReport(JSON.parse(e.target.result)));
      dashboard.classList.remove('hidden');
      $('#load-status').textContent = 'Loaded ' + file.name + '. Files stay in this browser. Choose another report above.';
    } catch (err) {
      $('#load-status').textContent = 'Cannot load report: ' + err.message;
    }
  };
  reader.onerror = () => { if (sequence === loadSequence) $('#load-status').textContent = 'Cannot read this file. Please choose it again.'; };
  reader.readAsText(file);
}

function render(r) {
  const cards = [['Internal records', r.total_internal, 'total'], ['On-chain operations', r.total_on_chain, 'total'],
    ['Matches', r.total_matched, 'match'], ['Discrepancies', r.total_discrepancies, 'discrepancy'], ['Unknown', r.total_unknown, 'unknown']];
  $('#stats').innerHTML = cards.map(([label, count, style]) => `<div class="stat-card ${style}"><div class="value">${count}</div><div class="label">${label}</div></div>`).join('');
  const types = [
    {label:'Matches', count:r.total_matched, color:'var(--green)'},
    {label:'Discrepancies', count:r.total_discrepancies, color:'var(--red)'},
    {label:'Unknown', count:r.total_unknown, color:'var(--amber)'}
  ];
  const max = Math.max(...types.map(t => t.count), 1);
  $('#chart').innerHTML = types.map(t => `<div class="bar" style="height:${Math.max(t.count/max*140, 2)}px;background:${t.color}"><div class="count">${t.count}</div><div class="bar-label">${t.label}</div></div>`).join('');
  const c = r.coverage;
  $('#coverage').innerHTML = `<h2>Evidence coverage</h2><p>On-chain history: ${c.complete ? 'complete (provider/caller assertion)' : 'incomplete'} · Application export: ${c.internal_complete ? 'complete (caller assertion)' : 'completeness unproven'}</p><p>Source: ${display(c.source)}</p><p>${display(c.reason)}</p><p>Accounts: ${display(c.accounts.join(', '))}</p><p>Displaying a report does not verify its authenticity or re-run reconciliation.</p>`;
  currentResults = r.results;
  renderTable(currentResults);
  $('#meta').textContent = 'Generated: ' + r.generated_at + ' · Network: ' + c.network + ' · Reconciliation window: ' + r.time_window_start + ' → ' + r.time_window_end;
}

function renderTable(results, filter = '') {
  const q = filter.toLowerCase();
  const filtered = results.filter(r => {
    const ip = r.internal_payment || {};
    const oc = r.on_chain_payment || {};
    return !q || [ip.id, ip.sender, ip.recipient, ip.asset, ip.amount, ip.asset_issuer, ip.operation_id, ip.business_reference,
      ip.reference_id, oc.account, oc.destination, oc.asset_code, oc.asset_issuer, oc.amount, oc.operation_id, oc.transaction_hash,
      r.notes, r.discrepancy, r.status, ...(r.candidate_operation_ids || [])].some(v => String(v ?? '').toLowerCase().includes(q));
  });
  // Keep large exports responsive; search still checks every result.
  const shown = filtered.slice(0, 500);
  $('#tbody').innerHTML = shown.map(r => {
    const ip = r.internal_payment || {};
    const oc = r.on_chain_payment || {};
    const badgeClass = ['EXACT', 'TOLERANT_MATCH'].includes(r.status) ? 'match' : r.status === 'DISCREPANCY' ? 'discrepancy' : 'unknown';
    const operations = [...new Set([ip.operation_id, oc.operation_id, ...(r.candidate_operation_ids || [])].filter(Boolean))];
    const asset = [ip.asset || oc.asset_code, ip.asset_issuer || oc.asset_issuer].filter(Boolean).join(' / ');
    return `<tr><td><span class="badge ${badgeClass}">${display(r.status)}</span></td><td>${display(r.discrepancy)}</td><td>${display(ip.id)}</td><td>${display(operations.join(', '))}</td><td>${display(ip.amount || oc.amount)}</td><td>${display(asset)}</td><td>${display(ip.sender || oc.account)}</td><td>${display(ip.recipient || oc.destination)}</td><td>${display(r.amount_delta)}</td><td>${display(r.notes)}</td></tr>`;
  }).join('') || '<tr><td colspan="10">No matching results.</td></tr>';
  $('#result-count').textContent = 'Showing ' + shown.length + ' of ' + filtered.length + ' matching results (' + results.length + ' total). ' + (filtered.length > 500 ? 'Refine search to see other records.' : '');
}

</script>
</body>
</html>
